<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ecoeco · início</title>
<link rel="stylesheet" href="tokens.css?v=6449ad4f"><link rel="stylesheet" href="inicio.css?v=61648560"></head>
<body>
<header class="barra">
  <b>ecoeco · início</b>
  <nav id="passos" aria-label="Passos"><button data-t="icone">Ícone</button><button data-t="splash">Splash</button><button data-t="titulo">Título</button><button data-t="ajustes">Ajustes</button><button data-t="entrada">Entrada</button><button data-t="registro">Registro</button></nav>
  <div class="modo" role="group" aria-label="Quando abre"><button data-m="primeira" aria-pressed="true">1ª abertura</button><button data-m="continuar" aria-pressed="false">Continuar</button></div>
</header>
<main class="palco">
  <aside class="notas" id="notas"></aside>
  <div class="caixa"><div class="phone" id="phone"><div class="tela" id="tela">

    <!-- 0 ÍCONE -->
    <section class="s" data-s="icone"><div class="home">
      <div class="apps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="icone-grande"><div class="app-icon"><img src="assets/glifo.png" alt=""></div></div>
      <div class="formas"><div class="app-icon circ"><img src="assets/glifo.png" alt=""></div><div class="app-icon sq"><img src="assets/glifo.png" alt=""></div><div class="app-icon mono"><img src="assets/glifo.png" alt=""></div></div>
      <p class="leg">ecoeco · ícone adaptativo (círculo, quadrado, monocromático)</p>
    </div></section>

    <!-- 1 SPLASH -->
    <section class="s fundo" data-s="splash"><div class="luz"></div>
      <img class="espiral" src="assets/espiral.png" alt="">
      <svg class="carga" viewBox="0 0 32 32" aria-label="Carregando"><circle class="src" cx="9" cy="16" r="2.7"/><path class="a1" d="M14 11.4a6.4 6.4 0 0 1 0 9.2"/><path class="a2" d="M18.6 8a11.4 11.4 0 0 1 0 16"/><path class="a3" d="M23.2 4.6a16.2 16.2 0 0 1 0 22.8"/></svg>
    </section>

    <!-- 2 TÍTULO -->
    <section class="s fundo" data-s="titulo"><div class="luz"></div>
      <img class="marca" src="assets/marca.png" alt="ecoeco">
      <button class="bolha mini ajuste-btn" id="abrirAjustes" aria-label="Ajustes"><svg viewBox="0 0 32 32"><circle cx="8" cy="11" r="3.2"/><circle cx="17" cy="21" r="4.4"/><circle cx="25" cy="10" r="2.2"/><path d="M5 22c4 2 6 1 8-1M20 14c2-1 3-2 4-3" /></svg></button>
      <div class="planeta" id="planeta"><img src="assets/planeta-1A.webp" alt=""></div>
      <div class="estado" id="estado" hidden><i></i><i></i><i></i><span>Planeta Terra</span></div>
      <button class="bolha grande" id="comecar" aria-label="Tocar para começar">
        <svg viewBox="0 0 32 32" class="ic-eco"><circle class="src" cx="9" cy="16" r="2.7"/><path class="a1" d="M14 11.4a6.4 6.4 0 0 1 0 9.2"/><path class="a2" d="M18.6 8a11.4 11.4 0 0 1 0 16"/><path class="a3" d="M23.2 4.6a16.2 16.2 0 0 1 0 22.8"/></svg>
        <svg viewBox="0 0 32 32" class="ic-cont"><path d="M7 17c3 3 5 5 7 7 4-8 8-12 12-15"/><circle cx="6" cy="9" r="1.6"/><circle cx="26" cy="22" r="1.3"/></svg>
      </button>
      <div class="onda"></div>
    </section>

    <!-- 3 AJUSTES -->
    <section class="s" data-s="ajustes" aria-hidden="true">
      <div class="folha" id="folha" role="dialog" aria-label="Ajustes">
        <i class="alca"></i>
        <div class="lin"><svg viewBox="0 0 32 32"><path d="M6 12v8h5l7 6V6l-7 6z"/><path d="M22 11c2 3 2 7 0 10"/></svg><span class="rot bloq">Som</span><button class="chave bloq" aria-label="Som (chega com a trilha)" disabled><i></i></button></div>
        <div class="lin"><svg viewBox="0 0 32 32"><path d="M9 7h14v18H9z"/><path d="M4 12v8M28 12v8"/></svg><span class="rot">Vibração</span><button class="chave on" id="vibra" aria-label="Vibração" aria-pressed="true"><i></i></button></div>
        <div class="lin col"><div class="lin2"><svg viewBox="0 0 32 32"><circle cx="9" cy="16" r="2.7"/><path d="M14 11.4a6.4 6.4 0 0 1 0 9.2M18.6 8a11.4 11.4 0 0 1 0 16"/></svg><span class="rot">Pistas</span></div>
          <div class="pistas" id="pistas" role="radiogroup" aria-label="Insistência das pistas"><button role="radio" data-v="1" aria-label="Calma"><i></i></button><button role="radio" data-v="2" aria-label="Média" aria-checked="true"><i></i><i></i></button><button role="radio" data-v="3" aria-label="Sempre"><i></i><i></i><i></i></button></div></div>
        <div class="lin"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="4.5"/><path d="M6 26c2-6 5-8 10-8s8 2 10 8"/></svg><span class="rot">Conta <em>opcional</em></span><button class="bolha mini" id="conta" aria-label="Vincular conta"><svg viewBox="0 0 32 32"><path d="M8 17l5 5 11-12"/></svg></button></div>
        <button class="bolha mini fechar" id="fechar" aria-label="Fechar"><svg viewBox="0 0 32 32"><path d="M9 9l14 14M23 9L9 23"/></svg></button>
      </div>
    </section>

    <!-- 4 ENTRADA -->
    <section class="s" data-s="entrada"><div class="luz"></div>
      <div class="mundo"><div class="planeta grande-mundo"><img src="assets/planeta-1A.webp" alt=""></div></div>
      <span class="chip">Planeta Terra</span>
      <div class="passa" id="passa"><i></i></div>
    </section>

    <!-- 5 REGISTRO: primeiro eco encontrado -->
    <section class="s" data-s="registro"><div class="luz"></div>
      <div class="cena"><i class="rastro r1"></i><i class="rastro r2"></i><i class="rastro r3"></i>
        <div class="cria"><img src="assets/rabanete-antena.webp" alt=""></div></div>
      <h2 class="nome" id="nome" aria-live="polite"></h2>
      <dl class="ficha" id="ficha"></dl>
      <button class="bolha mini colecao" id="colecao" aria-label="Coleção (nome a definir)"><svg viewBox="0 0 32 32"><circle cx="9" cy="10" r="3"/><circle cx="21" cy="9" r="2"/><circle cx="15" cy="21" r="4"/><circle cx="26" cy="22" r="2.2"/></svg><b id="cont">0</b></button>
      <button class="bolha mini repete" id="repete" aria-label="Ver de novo"><svg viewBox="0 0 32 32"><path d="M8 16a8 8 0 1 0 3-6.2M8 6v5h5"/></svg></button>
    </section>

  </div></div></div>
  <aside class="notas dir" id="notas2"></aside>
</main>
<script src="inicio.js?v=5665a690"></script>
</body></html>
