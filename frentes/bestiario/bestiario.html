<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bestiário e inventário · ecoeco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{--ink:#fff5e3;--mut:#cdc6e0;--l:#ffffff14}
*{box-sizing:border-box}body{margin:0;background:#0d1121;color:var(--ink);font:15px/1.45 'DM Sans',sans-serif}
header{padding:28px 16px 6px;max-width:900px;margin:auto}h1{font:700 1.5rem 'Zen Kaku Gothic New';margin:0 0 4px}header p{margin:0;color:var(--mut);max-width:62ch}
.dec{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.dec span{font-size:.74rem;padding:.2rem .65rem;border-radius:100px;background:var(--l);box-shadow:inset 0 0 0 1px #ffffff2a}
main{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:20px 16px 60px}
figure{margin:0;width:360px;max-width:100%}figcaption{font-size:.8rem;color:var(--mut);margin-top:8px;text-align:center}
.ph{position:relative;height:700px;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#26324a,#2d2842 55%,#1b1d33);box-shadow:0 20px 50px -20px #000,inset 0 0 0 1px #ffffff22}
.top{display:flex;align-items:center;gap:8px;padding:16px 16px 6px}.top h2{font:700 1.05rem 'Zen Kaku Gothic New';margin:0;flex:1}
.btn{border:0;color:#fff;font:650 .76rem 'DM Sans';padding:.45rem .95rem;border-radius:100px;cursor:pointer;background:linear-gradient(160deg,#ffffff34,color-mix(in srgb,var(--c2,#ff5f9e) 45%,transparent));box-shadow:inset 0 1px 1px #fffb,0 6px 12px -6px var(--c2,#ff5f9e)}
.round{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:1rem}
.cnt{font:700 .8rem 'DM Sans';padding:.3rem .7rem;border-radius:100px;background:var(--l);box-shadow:inset 0 0 0 1px #ffffff2a}.cnt small{color:var(--mut);font-weight:500}
.body{flex:1;overflow:auto;padding:0 14px 8px;min-height:0}
/* herói */
.hero{position:relative;display:grid;justify-items:center;padding:6px 0 4px;--c1:#fff;--c2:#ff5f9e}
.hero .glow{position:absolute;inset:0 18% 18%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c2) 40%,transparent),transparent);filter:blur(10px)}
.stage{position:relative;width:200px;height:170px;display:grid;align-items:end;justify-items:center}
.stage img,.stage svg{position:relative;height:150px;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 6px #0005)}
.floor{position:absolute;bottom:2px;width:60%;height:14px;border-radius:50%;background:radial-gradient(closest-side,#0009,transparent)}
.hero h3{font:700 1.25rem 'Zen Kaku Gothic New';margin:2px 0 0}.pill{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .6rem;border-radius:100px;background:color-mix(in srgb,var(--c2) 45%,transparent);box-shadow:inset 0 1px 1px #fff8}
.hero p{margin:4px 0 8px;font-size:.76rem;color:var(--mut);text-align:center}
/* grade uniforme: sem bolha, mesma célula para todos */
.chips{display:flex;gap:6px;margin:10px 0 8px}.chip{border:0;color:#fff;font:600 .74rem 'DM Sans';padding:.35rem .8rem;border-radius:100px;cursor:pointer;background:var(--l);box-shadow:inset 0 0 0 1px #ffffff2a}.chip[aria-selected=true]{background:#ffffff38;box-shadow:inset 0 1px 1px #fffb}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0;padding:0}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-rows:auto 1fr;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#ffffff1e,#ffffff0a);box-shadow:inset 0 0 0 1px #ffffff1f}
.cell[aria-pressed=true]{box-shadow:inset 0 0 0 2px #fff,0 0 18px -4px var(--c2)}
.cell .n{font:700 .62rem 'DM Sans';letter-spacing:.06em;padding:.22rem .5rem;background:color-mix(in srgb,var(--c2) 38%,#ffffff12);color:#fff}
.cell[data-st=nao] .n{background:#ffffff18;color:var(--mut)}
.cell .art{position:relative;aspect-ratio:1;display:grid;align-items:end;justify-items:center;padding:8px 6px 10px}
.cell .art::after{content:"";position:absolute;bottom:7px;width:56%;height:7px;border-radius:50%;background:radial-gradient(closest-side,#0007,transparent)}
.cell .art>*{position:relative;z-index:1;height:100%;width:100%;object-fit:contain}
.cell[data-st=nao] .art>*{filter:brightness(0) invert(1);opacity:.14}
.cell[data-st=visto] .art>*{filter:saturate(.35) brightness(.95)}
.cell.vazio{opacity:.5;background:transparent;outline:1.5px dashed #ffffff40;outline-offset:-2px;box-shadow:none}
.cell.vazio .art::after{display:none}
/* materiais */
.mhero{display:grid;justify-items:center;gap:2px;padding:6px 0 10px;--c1:#fff;--c2:#ff5f9e}
.mhero .big{width:110px;height:110px}.mhero svg{width:100%;height:100%}
.mhero h3{font:700 1.2rem 'Zen Kaku Gothic New';margin:0}.mhero p{margin:0;font-size:.76rem;color:var(--mut);text-align:center}
.qty{font:700 2rem 'Zen Kaku Gothic New'}
.mcell .art>*{height:100%}.mcell .q{position:absolute;right:6px;top:5px;font:700 .8rem 'DM Sans';z-index:2}
.cell[data-z="0"] .art>*{filter:brightness(0) invert(1);opacity:.14}
h4{font:700 .72rem 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:#ffd9a8;margin:12px 0 6px}
.recs{display:grid;gap:5px;margin:0;padding:0;list-style:none}.recs li{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;padding:.45rem .8rem;border-radius:14px;background:#ffffff0d}.recs em{font-style:normal;color:#ffd0a8;font-size:.7rem}.recs li.ok em{color:#b6f5a0}.recs small{color:var(--mut)}
/* barra de baixo */
.nav{display:flex;gap:6px;padding:8px 14px 14px;background:linear-gradient(0deg,#0d1121cc,transparent)}.nav button{flex:1;border:0;color:var(--mut);font:650 .8rem 'DM Sans';padding:.6rem;border-radius:100px;background:var(--l);cursor:pointer}.nav button[aria-selected=true]{color:#fff;background:#ffffff38;box-shadow:inset 0 1px 1px #fffb}
.carta{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:9;background:#14131f}
.toast{position:absolute;left:14px;right:14px;top:60px;z-index:5;padding:.55rem .9rem;border-radius:22px;font-size:.8rem;background:linear-gradient(160deg,#ffffff40,#ffffff18);backdrop-filter:blur(16px);box-shadow:inset 0 1px 1px #fffb;transition:.4s}.toast[hidden]{display:block;opacity:0;transform:translateY(-14px);pointer-events:none}
.game{position:relative;flex:1;display:grid;place-items:center}.game .planet{width:230px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff59a,#4a9d56 45%,#1f4d4a)}
.hud{position:absolute;top:16px;left:14px;right:14px;display:flex;gap:6px;align-items:center}.hud .btn{background:#ffffff22;box-shadow:inset 0 1px 1px #fff8}
</style></head><body>
<header><h1>Bestiário e inventário</h1><p>Rodada 21 · frente bestiário. Agora são telas cheias, um HUD à parte que substitui o do jogo. Os bichos ficam em células iguais, sem bolha. Tocar numa célula abre a carta do passaporte em tela cheia.</p>
<div class="dec"><span>Álbum</span><span>A06 silhueta</span><span>Visto existe</span><span>Posse: fotografar</span><span>Células uniformes</span></div></header>
<main>
<figure><div class="ph" id="p0"></div><figcaption>Do jogo: o chip do HUD abre a tela cheia. Toque em “Bestiário” ou no chip de materiais.</figcaption></figure>
<figure><div class="ph" id="p1"></div><figcaption>Bestiário: bicho grande em cima, grade 3×N embaixo. Todos no mesmo enquadramento.</figcaption></figure>
<figure><div class="ph" id="p2"></div><figcaption>Materiais: mesma gramática de célula e herói. Receitas abaixo.</figcaption></figure>
</main>
<script>
const A=n=>`assets/${n}.webp`;
const LAG=`<svg viewBox="0 0 64 64" fill="none" stroke="#ffcf8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40c6-14 18-18 28-12 6 4 10 3 14-2" fill="#e8572a66"/><path d="M10 40c4 6 14 8 24 4s16-2 20 4"/><circle cx="50" cy="26" r="1.6" fill="#fff5e3" stroke="none"/><path d="M20 44l-4 8M30 46l-2 8M42 46l2 8M50 46l4 6M12 38l-6-2"/><path d="M26 30l2-5 3 4 3-5 3 5" stroke="#ffb36b"/></svg>`;
const SP=[{id:"brotinho",n:"Brotinho",img:A("brotinho-frente"),pl:"terra",reg:"Bosque do Orvalho",hint:"Chora perto de uma árvore com gota",c:["#f2ff9e","#5fcf4a"],st:"possui"},
{id:"cinza",n:"Bichinho-cinza",img:A("bichinho-cinza"),pl:"terra",reg:"Encosta de Pedra",hint:"Vive entre as rochas duras",c:["#e4e0f2","#8a83a8"],st:"visto"},
{id:"rabanete",n:"Rabanete-antena",img:A("rabanete-antena"),pl:"vulcanico",reg:"Planeta vulcânico",hint:"Escuta longe, na terra quente",c:["#ffc2a8","#ff5f7e"],st:"nao"},
{id:"lagarto",n:"Lagarto-deserto",svg:LAG,pl:"vulcanico",reg:"Deserto do vulcânico",hint:"Toma sol nas pedras quentes",c:["#ffcf8a","#e8572a"],st:"nao"}];
const LB={possui:"Na coleção",visto:"Visto",nao:"Não descoberto"};
const no=s=>String(SP.indexOf(s)+1).padStart(3,"0"),art=s=>s.img?`<img src="${s.img}" alt="">`:s.svg;
const ic=(p,c)=>`<svg viewBox="0 0 64 64" fill="none" stroke="${c[0]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const MATS=[{id:"fibra",n:"Fibra",q:3,c:["#e6ff86","#1fbf5b"],d:"Folhas e caules. Vira passarela e canal.",p:'<path d="M32 54V26M32 40c-10-2-16-10-16-20 10 0 16 8 16 20M32 34c8-2 14-8 14-16-9 0-14 6-14 16" fill="#1fbf5b55"/>'},
{id:"pedra",n:"Pedra",q:1,c:["#e4e0f2","#8a83a8"],d:"Lascas das rochas duras. Vira passarela e placa.",p:'<path d="M12 48 18 28 34 18 52 26 56 46 44 54Z" fill="#8a83a866"/><path d="M30 26 38 36 34 46"/>'},
{id:"semente",n:"Semente",q:1,c:["#ffe39a","#d08a2a"],d:"Guarde para plantar.",p:'<path d="M32 12c12 10 14 28 0 40-14-12-12-30 0-40Z" fill="#d08a2a66"/><path d="M32 20v28"/>'},
{id:"placa",n:"Placa",q:0,c:["#bfe0ff","#4f63f2"],d:"Fabricada a partir de fibra e pedra. Vai na nave.",p:'<path d="M16 22 32 14 48 22V42L32 50 16 42Z" fill="#4f63f255"/><path d="M16 22 32 30 48 22M32 30v20"/>'},
{id:"nucleo",n:"Núcleo",q:0,c:["#ffb3d6","#ff4f86"],d:"Ainda não encontrado. Vai na nave.",p:'<circle cx="32" cy="32" r="14" fill="#ff4f8666"/><circle cx="32" cy="32" r="22" stroke-dasharray="3 6"/><circle cx="27" cy="27" r="3" fill="#fff" stroke="none"/>'}];
const REC=[["Passarela","fibra 2 · pedra 2",0],["Canal","fibra 1 · pedra 1",1],["Placa","fibra 1 · pedra 1",1],["Nave","placa 1 · núcleo 1",0]];
const st={tab:"jogo",sel:"brotinho",msel:"fibra",pl:"todos"};
function toast(el,t){const x=el.querySelector(".toast");x.innerHTML=t;x.hidden=false;setTimeout(()=>x.hidden=true,2400)}
function nav(t){return `<div class="nav">${[["best","Bestiário"],["inv","Materiais"]].map(([k,l])=>`<button data-t="${k}" aria-selected="${t===k}">${l}</button>`).join("")}</div>`}
function best(){const s=SP.find(x=>x.id===st.sel),own=SP.filter(x=>x.st==="possui").length;
 const list=SP.filter(x=>st.pl==="todos"||x.pl===st.pl);
 const cells=list.map(x=>`<li><button class="cell" data-st="${x.st}" data-id="${x.id}" aria-pressed="${x.id===st.sel}" style="--c2:${x.c[1]}"><span class="n">Nº ${no(x)}</span><span class="art">${art(x)}</span></button></li>`).join("")+(st.pl==="todos"?[5,6].map(i=>`<li><span class="cell vazio"><span class="n" style="background:transparent">Nº 00${i}</span><span class="art"></span></span></li>`).join(""):"");
 const hid=s.st==="nao";
 return `<div class="top"><button class="btn round" data-t="jogo">←</button><h2>Bestiário</h2><span class="cnt">${own}<small>/${SP.length}</small></span></div><div class="body">
 <div class="hero" style="--c1:${s.c[0]};--c2:${s.c[1]}"><i class="glow"></i><div class="stage"><i class="floor"></i><span style="display:contents;${hid?"filter:brightness(0) invert(1);opacity:.16":s.st==="visto"?"filter:saturate(.35)":""}">${art(s)}</span></div>
 <h3>${hid?"Nº "+no(s)+" · ?":s.n}</h3><span class="pill">${LB[s.st]}</span><p>${s.st==="possui"?s.reg:s.st==="visto"?"Visto · "+s.reg+". Fotografe para registrar.":s.hint}</p>
 ${s.st==="visto"?'<button class="btn" id="act">Fotografar</button>':s.st==="possui"?'<button class="btn" id="act">Seguir o eco</button>':'<button class="btn" id="act">Simular: avistar</button>'}</div>
 <div class="chips">${[["todos","Todos"],["terra","Terra"],["vulcanico","Vulcânico"]].map(([k,l])=>`<button class="chip" data-p="${k}" aria-selected="${st.pl===k}">${l}</button>`).join("")}</div>
 <ul class="grid">${cells}</ul></div>${nav("best")}<div class="toast" hidden></div>`}
function inv(){const m=MATS.find(x=>x.id===st.msel);
 return `<div class="top"><button class="btn round" data-t="jogo">←</button><h2>Materiais</h2><span class="cnt">${MATS.reduce((a,x)=>a+x.q,0)}<small> itens</small></span></div><div class="body">
 <div class="mhero" style="--c2:${m.c[1]}"><div class="big">${ic(m.p,m.c)}</div><span class="qty">${m.q}</span><h3>${m.n}</h3><p>${m.d}</p></div>
 <ul class="grid">${MATS.map(x=>`<li><button class="cell mcell" data-z="${x.q?1:0}" data-m="${x.id}" aria-pressed="${x.id===st.msel}" style="--c2:${x.c[1]}"><span class="n">${x.n}</span><span class="art"><b class="q">${x.q}</b>${ic(x.p,x.c)}</span></button></li>`).join("")}</ul>
 <h4>O que dá para fazer</h4><ul class="recs">${REC.map(r=>`<li class="${r[2]?"ok":""}"><span>${r[0]} <small>${r[1]}</small></span><em>${r[2]?"Dá para fazer":"Falta material"}</em></li>`).join("")}</ul></div>${nav("inv")}`}
function game(){return `<div class="game"><i class="planet"></i><div class="hud"><span class="btn">Planeta Terra</span><button class="btn" data-t="inv" style="margin-left:auto">3 · 1 · 1</button><button class="btn" data-t="best">Bestiário ${SP.filter(x=>x.st==="possui").length}/${SP.length}</button></div></div>`}
function render(id,tab){const el=document.getElementById(id);el.dataset.tab=tab;el.innerHTML=tab==="best"?best():tab==="inv"?inv():game();
 el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>render(id,b.dataset.t));
 el.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{st.sel=b.dataset.id;render(id,"best");abrir(id,SP.find(x=>x.id===st.sel))});
 el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{st.msel=b.dataset.m;render(id,"inv")});
 el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{st.pl=b.dataset.p;render(id,"best")});
 const a=el.querySelector("#act");if(a)a.onclick=()=>{const s=SP.find(x=>x.id===st.sel);if(s.st==="visto"){s.st="possui";render(id,"best");toast(document.getElementById(id),s.n+" entrou na coleção")}else if(s.st==="nao"){s.st="visto";render(id,"best");toast(document.getElementById(id),"Você viu algo novo. Fotografe para registrar.")}}}
const CARTA={brotinho:1,cinza:6,rabanete:2},STM={possui:"foto",visto:"visto",nao:"nao"};
function abrir(id,sp){const el=document.getElementById(id);if(!CARTA[sp.id])return false;el.querySelector(".carta")?.remove();const f=document.createElement("iframe");f.className="carta";f.title="Carta de "+sp.n;f.src=`carta/carta.html?embed=1&id=${CARTA[sp.id]}&st=${STM[sp.st]}`;el.append(f);return true}
addEventListener("message",e=>{if(e.data&&e.data.fechar)document.querySelectorAll(".ph .carta").forEach(f=>f.remove())});
render("p0","jogo");render("p1","best");render("p2","inv");
</script></body></html>
